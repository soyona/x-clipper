name: Bug report
description: Report a reproducible X Article Clipper problem without sharing sensitive data.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve X Article Clipper. Never include cookies, tokens, private messages, private account content, or a full-page DOM dump.
  - type: dropdown
    id: surface
    attributes:
      label: Where did the problem happen?
      options:
        - X Post detail page
        - X Article detail page
        - Read later
        - Materials
        - Authors
        - Local reader / Markdown preview
        - Backup / restore
        - Installation
        - Other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Use a public example when possible and remove unrelated personal information.
      placeholder: |
        1. Opened…
        2. Selected…
        3. Observed…
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: X Article Clipper version
      placeholder: 1.1.1
    validations:
      required: true
  - type: input
    id: chrome
    attributes:
      label: Chrome and operating system
      placeholder: Chrome 140 on macOS 15
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Minimal redacted evidence
      description: Optional screenshot, short console error, or smallest relevant DOM/attribute excerpt. Do not paste a full page snapshot.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed cookies, tokens, private content, and unrelated personal data.
          required: true
