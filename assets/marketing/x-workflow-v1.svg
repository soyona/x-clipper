<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs><radialGradient id="g"><stop stop-color="#1d9bf0" stop-opacity=".28"/><stop offset="1" stop-color="#1d9bf0" stop-opacity="0"/></radialGradient></defs>
  <rect width="1600" height="900" fill="#000"/><circle cx="1480" cy="40" r="850" fill="url(#g)"/>
  <text x="80" y="118" fill="#fff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="58" font-weight="800" letter-spacing="-1.8">From discovery to reuse</text>
  <text x="82" y="168" fill="#8b98a5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="26">A deliberate local workflow for the valuable ideas you find on X.</text>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif">
    <g transform="translate(64 230)"><rect width="464" height="540" rx="30" fill="#16181c" stroke="#2f3336"/><image href="screenshots/04-x-action-menu.png" x="14" y="14" width="436" height="240"/><circle cx="42" cy="306" r="18" fill="#1d9bf0"/><text x="42" y="313" text-anchor="middle" fill="#fff" font-size="19" font-weight="800">1</text><text x="78" y="316" fill="#e7e9ea" font-size="30" font-weight="750">Save deliberately</text><text x="28" y="376" fill="#8b98a5" font-size="23"><tspan x="28">Capture the current Post or Article</tspan><tspan x="28" dy="36">only when it is worth keeping.</tspan></text></g>
    <g transform="translate(568 230)"><rect width="464" height="540" rx="30" fill="#16181c" stroke="#2f3336"/><image href="screenshots/03-tag-search.png" x="14" y="14" width="436" height="240"/><circle cx="42" cy="306" r="18" fill="#1d9bf0"/><text x="42" y="313" text-anchor="middle" fill="#fff" font-size="19" font-weight="800">2</text><text x="78" y="316" fill="#e7e9ea" font-size="30" font-weight="750">Find it again</text><text x="28" y="376" fill="#8b98a5" font-size="23"><tspan x="28">Use tags and search instead of</tspan><tspan x="28" dy="36">scrolling through endless bookmarks.</tspan></text></g>
    <g transform="translate(1072 230)"><rect width="464" height="540" rx="30" fill="#16181c" stroke="#2f3336"/><image href="screenshots/05-local-reader-markdown.png" x="14" y="14" width="436" height="240"/><circle cx="42" cy="306" r="18" fill="#1d9bf0"/><text x="42" y="313" text-anchor="middle" fill="#fff" font-size="19" font-weight="800">3</text><text x="78" y="316" fill="#e7e9ea" font-size="30" font-weight="750">Reuse the insight</text><text x="28" y="376" fill="#8b98a5" font-size="23"><tspan x="28">Read the local snapshot and move</tspan><tspan x="28" dy="36">clean Markdown into your workflow.</tspan></text></g>
  </g>
  <text x="80" y="842" fill="#71767b" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="22">X Article Clipper · github.com/soyona/x-clipper</text>
