  <text x="160" y="104" fill="#e7e9ea" font-family="-apple-system,'PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="29" font-weight="700">X Article Clipper</text>
  <text x="72" y="300" fill="#fff" font-family="-apple-system,'PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="82" font-weight="800"><tspan x="72">你的内容</tspan><tspan x="72" dy="106">应该由你掌控</tspan></text>
  <g font-family="-apple-system,'PingFang SC','Microsoft YaHei',Arial,sans-serif">
    <rect x="72" y="548" width="1098" height="112" rx="28" fill="#16181c" stroke="#2f3336"/><circle cx="126" cy="604" r="13" fill="#1d9bf0"/><text x="166" y="616" fill="#e7e9ea" font-size="34" font-weight="650">本地存储，支持手动备份与恢复</text>
    <rect x="72" y="684" width="1098" height="112" rx="28" fill="#16181c" stroke="#2f3336"/><circle cx="126" cy="740" r="13" fill="#1d9bf0"/><text x="166" y="752" fill="#e7e9ea" font-size="34" font-weight="650">不调用 X API，不上传保存的正文</text>
    <rect x="72" y="820" width="1098" height="112" rx="28" fill="#16181c" stroke="#2f3336"/><circle cx="126" cy="876" r="13" fill="#1d9bf0"/><text x="166" y="888" fill="#e7e9ea" font-size="34" font-weight="650">MIT 开源，可自由使用、修改和商用</text>
    <text x="72" y="1035" fill="#8b98a5" font-size="29"><tspan x="72">当前边界：不导入历史 Bookmarks，</tspan><tspan x="72" dy="46">仅从 Post / Article 详情页主动保存。</tspan></text>
    <text x="72" y="1190" fill="#8b98a5" font-size="29"><tspan x="72">面向已经使用 X 获取高质量信息的</tspan><tspan x="72" dy="46">学习者、开发者和内容创作者。</tspan></text>
