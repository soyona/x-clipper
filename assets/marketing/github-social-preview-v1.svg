<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title description">
  <title id="title">X Article Clipper GitHub social preview</title>
  <desc id="description">Keep the signal. Find it again. A private, searchable knowledge base for valuable X Posts and Articles.</desc>
  <defs>
    <radialGradient id="blue-glow" cx="0" cy="0" r="1" gradientTransform="translate(1120 72) rotate(145) scale(660 520)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1d9bf0" stop-opacity="0.28"/>
      <stop offset="0.62" stop-color="#1d9bf0" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#1d9bf0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="edge" x1="80" y1="60" x2="1200" y2="580" gradientUnits="userSpaceOnUse">
      <stop stop-color="#536471"/>
      <stop offset="0.45" stop-color="#2f3336"/>
      <stop offset="1" stop-color="#1d9bf0" stop-opacity="0.62"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="640" fill="#000000"/>
  <rect width="1280" height="640" fill="url(#blue-glow)"/>
  <rect x="40.5" y="40.5" width="1199" height="559" rx="31.5" fill="none" stroke="url(#edge)"/>

  <g transform="translate(92 88)">
    <rect width="144" height="144" rx="34" fill="#ffffff"/>
    <rect x="5" y="5" width="134" height="134" rx="30" fill="#000000"/>
    <g transform="translate(17 17) scale(4.5833333)" color="#ffffff">
      <path d="M16.7 5.3C12 1.9 5.3 4 3.9 9.7 2.5 15.4 7.4 20.5 13.3 19.7L14.2 19.15" fill="none" stroke="currentColor" stroke-width="2.35" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M7.2 10.15h5.4M7.2 13.15h4.35" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/>
      <path d="m14.2 19.15 1-2.9 4.55-4.55 2.6 2.6-4.55 4.55-3.6.3Zm1.35-1.3 1.55-.35-1.2-1.2-.35 1.55Z" fill="currentColor" fill-rule="evenodd"/>
    </g>
  </g>

  <text x="92" y="286" fill="#e7e9ea" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="35" font-weight="700" letter-spacing="-0.5">X Article Clipper</text>
  <text x="92" y="336" fill="#71767b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="24">Open source · Local first · MIT</text>

  <g transform="translate(492 124)">
    <text fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="70" font-weight="800" letter-spacing="-2.4">
      <tspan x="0" y="0">Keep the signal.</tspan>
      <tspan x="0" y="88">Find it again.</tspan>
    </text>
    <text fill="#8b98a5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="29" font-weight="400">
      <tspan x="2" y="188">A private, searchable knowledge base for</tspan>
      <tspan x="2" y="230">valuable X Posts and Articles.</tspan>
    </text>
    <g transform="translate(2 292)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="22" font-weight="600">
      <rect width="190" height="52" rx="26" fill="#16181c" stroke="#2f3336"/>
      <text x="95" y="34" fill="#e7e9ea" text-anchor="middle">Searchable</text>
      <rect x="206" width="190" height="52" rx="26" fill="#16181c" stroke="#2f3336"/>
      <text x="301" y="34" fill="#e7e9ea" text-anchor="middle">Local storage</text>
      <rect x="412" width="190" height="52" rx="26" fill="#16181c" stroke="#2f3336"/>
      <text x="507" y="34" fill="#e7e9ea" text-anchor="middle">Markdown ready</text>
    </g>
  </g>

  <text x="92" y="548" fill="#71767b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="23">github.com/soyona/x-clipper</text>
