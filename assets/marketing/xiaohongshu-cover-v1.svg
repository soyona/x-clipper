<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1440" viewBox="0 0 1080 1440" role="img" aria-labelledby="title description">
  <title id="title">X Article Clipper 小红书首发封面</title>
  <desc id="description">收藏夹不是知识库。把 X 上筛选出的高质量内容，变成可检索、可复用的本地资料库。</desc>
  <defs>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(980 20) rotate(145) scale(720 700)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1d9bf0" stop-opacity="0.38"/>
      <stop offset="0.68" stop-color="#1d9bf0" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#1d9bf0" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="shot-clip"><rect x="76" y="803" width="928" height="510" rx="22"/></clipPath>
  </defs>

  <rect width="1080" height="1440" fill="#000000"/>
  <rect width="1080" height="1440" fill="url(#glow)"/>

  <g transform="translate(76 72)">
    <rect width="72" height="72" rx="17" fill="#ffffff"/>
    <rect x="3" y="3" width="66" height="66" rx="15" fill="#000000"/>
    <g transform="translate(9 9) scale(2.25)" color="#ffffff">
      <path d="M16.7 5.3C12 1.9 5.3 4 3.9 9.7 2.5 15.4 7.4 20.5 13.3 19.7L14.2 19.15" fill="none" stroke="currentColor" stroke-width="2.35" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M7.2 10.15h5.4M7.2 13.15h4.35" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/>
      <path d="m14.2 19.15 1-2.9 4.55-4.55 2.6 2.6-4.55 4.55-3.6.3Zm1.35-1.3 1.55-.35-1.2-1.2-.35 1.55Z" fill="currentColor" fill-rule="evenodd"/>
    </g>
  </g>
  <text x="170" y="120" fill="#e7e9ea" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif" font-size="30" font-weight="700">X Article Clipper</text>

  <text x="76" y="300" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif" font-size="92" font-weight="800" letter-spacing="-3">
    <tspan x="76" dy="0">收藏夹</tspan>
    <tspan x="76" dy="112">不是知识库</tspan>
  </text>

  <text x="80" y="540" fill="#8b98a5" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif" font-size="34" font-weight="500">
    <tspan x="80" dy="0">把 X 上筛选出的高质量内容</tspan>
    <tspan x="80" dy="52">变成可检索、可复用的本地资料库</tspan>
  </text>

  <g font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif" font-size="24" font-weight="600">
    <rect x="76" y="674" width="176" height="54" rx="27" fill="#16181c" stroke="#2f3336"/>
    <text x="164" y="710" fill="#e7e9ea" text-anchor="middle">本地存储</text>
    <rect x="270" y="674" width="176" height="54" rx="27" fill="#16181c" stroke="#2f3336"/>
    <text x="358" y="710" fill="#e7e9ea" text-anchor="middle">标签检索</text>
    <rect x="464" y="674" width="214" height="54" rx="27" fill="#16181c" stroke="#2f3336"/>
    <text x="571" y="710" fill="#e7e9ea" text-anchor="middle">复制 Markdown</text>
  </g>

  <rect x="62" y="789" width="956" height="538" rx="30" fill="#16181c" stroke="#536471" stroke-width="2"/>
  <image href="screenshots/03-tag-search.png" x="76" y="803" width="928" height="510" preserveAspectRatio="xMidYMid meet" clip-path="url(#shot-clip)"/>
  <text x="76" y="1381" fill="#71767b" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif" font-size="23">独立开发 · MIT 开源 · github.com/soyona/x-clipper</text>
</svg>
