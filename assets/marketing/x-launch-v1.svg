<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title description">
  <title id="title">X Article Clipper launch image</title>
  <desc id="description">Your bookmarks are not a knowledge base. Save the signal, search it later, and reuse it in Markdown.</desc>
  <defs>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(1510 40) rotate(145) scale(960 720)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1d9bf0" stop-opacity="0.32"/>
      <stop offset="0.65" stop-color="#1d9bf0" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#1d9bf0" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="shot-clip"><rect x="606" y="174" width="914" height="503" rx="22"/></clipPath>
  </defs>

  <rect width="1600" height="900" fill="#000000"/>
  <rect width="1600" height="900" fill="url(#glow)"/>

  <g transform="translate(80 72)">
    <rect width="76" height="76" rx="18" fill="#ffffff"/>
    <rect x="3" y="3" width="70" height="70" rx="16" fill="#000000"/>
    <g transform="translate(9 9) scale(2.4166667)" color="#ffffff">
      <path d="M16.7 5.3C12 1.9 5.3 4 3.9 9.7 2.5 15.4 7.4 20.5 13.3 19.7L14.2 19.15" fill="none" stroke="currentColor" stroke-width="2.35" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M7.2 10.15h5.4M7.2 13.15h4.35" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/>
      <path d="m14.2 19.15 1-2.9 4.55-4.55 2.6 2.6-4.55 4.55-3.6.3Zm1.35-1.3 1.55-.35-1.2-1.2-.35 1.55Z" fill="currentColor" fill-rule="evenodd"/>
    </g>
  </g>
  <text x="176" y="123" fill="#e7e9ea" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="30" font-weight="700">X Article Clipper</text>

  <text x="80" y="260" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="62" font-weight="800" letter-spacing="-2">
    <tspan x="80" dy="0">Your bookmarks</tspan>
    <tspan x="80" dy="72">are not a</tspan>
    <tspan x="80" dy="72">knowledge base.</tspan>
  </text>

  <text x="82" y="542" fill="#8b98a5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="28">
    <tspan x="82" dy="0">Save the signal.</tspan>
    <tspan x="82" dy="42">Search it later.</tspan>
    <tspan x="82" dy="42">Reuse it in Markdown.</tspan>
  </text>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="20" font-weight="600">
    <rect x="80" y="718" width="150" height="46" rx="23" fill="#16181c" stroke="#2f3336"/>
    <text x="155" y="748" fill="#e7e9ea" text-anchor="middle">Local first</text>
    <rect x="244" y="718" width="150" height="46" rx="23" fill="#16181c" stroke="#2f3336"/>
    <text x="319" y="748" fill="#e7e9ea" text-anchor="middle">Open source</text>
    <rect x="408" y="718" width="104" height="46" rx="23" fill="#16181c" stroke="#2f3336"/>
    <text x="460" y="748" fill="#e7e9ea" text-anchor="middle">MIT</text>
  </g>

  <rect x="592" y="160" width="942" height="531" rx="30" fill="#16181c" stroke="#536471" stroke-width="2"/>
  <image href="screenshots/04-x-action-menu.png" x="606" y="174" width="914" height="503" preserveAspectRatio="xMidYMid meet" clip-path="url(#shot-clip)"/>
  <text x="606" y="752" fill="#8b98a5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="23">Capture deliberately → organize locally → find and reuse</text>
  <text x="80" y="838" fill="#71767b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="22">github.com/soyona/x-clipper</text>
</svg>
