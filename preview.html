<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title data-i18n="markdownPreview">Markdown preview</title>
    <link rel="stylesheet" href="preview.css" />
  </head>
  <body>
    <main class="preview-page" aria-label="Markdown preview" data-i18n-aria-label="markdownPreview">
      <header class="preview-header">
        <div class="preview-heading">
          <strong id="preview-title" data-i18n="markdownPreview">Markdown preview</strong>
          <span id="preview-subtitle" data-i18n="temporaryOnDevice">Temporarily shown on this device</span>
        </div>
        <div class="preview-actions">
          <button id="save" class="preview-save-button" type="button" hidden>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.9" aria-hidden="true"><path d="M5 3.5A2.5 2.5 0 0 1 7.5 1h9A2.5 2.5 0 0 1 19 3.5V23l-7-4.5L5 23V3.5zM19 6v5M16.5 8.5h5"/></svg>
            <span data-i18n="saveMaterial">Save as material</span>
          </button>
          <button id="copy" class="preview-icon-button" type="button" disabled aria-label="Copy Markdown" title="Copy Markdown" data-i18n-aria-label="copyMarkdown" data-i18n-title="copyMarkdown">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 7.5V5.75A1.75 1.75 0 0 1 9.75 4h8.5A1.75 1.75 0 0 1 20 5.75v8.5A1.75 1.75 0 0 1 18.25 16H16.5"/><rect x="4" y="8" width="12" height="12" rx="1.75"/></svg>
          </button>
          <button id="close" class="preview-icon-button secondary" type="button" aria-label="Close preview" title="Close preview" data-i18n-aria-label="closePreview" data-i18n-title="closePreview">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg>
          </button>
        </div>
      </header>
      <article id="article" class="preview-reader">
        <p class="empty">Loading article…</p>
      </article>
      <p id="status" class="status" role="status" aria-live="polite"></p>
    </main>
    <script src="i18n.js"></script>
    <script src="markdown.js"></script>
    <script src="content-store.js"></script>
    <script src="content-db.js"></script>
    <script src="preview.js"></script>
  </body>
</html>
